<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LIVE SLIDE COMMANDER</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #020617;
      --surface: rgba(15, 23, 42, 0.6);
      --surface-hover: rgba(30, 41, 59, 0.8);
      --accent: #06b6d4;
      --accent-hover: #0891b2;
      --border: rgba(255, 255, 255, 0.1);
      --text: #f8fafc;
      --text-dim: #94a3b8;
    }
    
    body {
        background: radial-gradient(circle at top right, #1e1b4b 0%, var(--bg) 60%);
        color: var(--text);
        font-family: 'Inter', sans-serif;
        margin: 0; padding: 2rem;
        display: flex; flex-direction: column; align-items: center;
        min-height: 100vh; box-sizing: border-box;
    }
    
    .card {
        background: var(--surface);
        backdrop-filter: blur(24px);
        -webkit-backdrop-filter: blur(24px);
        border: 1px solid var(--border);
        padding: 2.5rem; border-radius: 24px;
        width: 100%; max-width: 650px;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 0 0 40px rgba(6, 182, 212, 0.1);
        position: relative;
        overflow: hidden;
    }

    /* Subtle glow effect behind card */
    .card::before {
        content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px;
        background: linear-gradient(90deg, transparent, rgba(6, 182, 212, 0.5), transparent);
    }

    .title {
        font-weight: 900; font-size: 1.8rem;
        background: linear-gradient(to right, #06b6d4, #3b82f6);
        -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        margin-bottom: 2rem; text-transform: uppercase;
        letter-spacing: 2px; text-align: center;
    }

    .section-title {
        font-size: 0.75rem; font-weight: 700; color: var(--text-dim);
        margin-bottom: 12px; text-transform: uppercase; letter-spacing: 1px;
    }

    /* Presets container */
    .presets {
        display: flex; gap: 12px; margin-bottom: 2rem; justify-content: center;
        flex-wrap: wrap;
    }
    .preset-btn {
        background: rgba(255,255,255,0.05); border: 1px solid var(--border);
        color: var(--text); padding: 10px 16px; border-radius: 12px;
        font-size: 0.8rem; font-weight: 600; cursor: pointer;
        transition: all 0.2s ease; display: flex; align-items: center; gap: 8px;
    }
    .preset-btn:hover {
        background: rgba(255,255,255,0.1); transform: translateY(-2px);
        border-color: rgba(255,255,255,0.2);
    }
    .preset-btn.orange:hover { border-color: #f59e0b; box-shadow: 0 4px 15px rgba(245, 158, 11, 0.2); }
    .preset-btn.red:hover { border-color: #ef4444; box-shadow: 0 4px 15px rgba(239, 68, 68, 0.2); }

    /* Form Fields */
    .field-group { margin-bottom: 1.5rem; }
    
    input[type="text"], input[type="number"], textarea, select {
        width: 100%; background: rgba(0,0,0,0.3); border: 1px solid var(--border);
        color: #fff; padding: 14px 16px; border-radius: 12px;
        font-family: inherit; font-size: 1rem; box-sizing: border-box;
        transition: all 0.2s; outline: none;
    }
    input:focus, textarea:focus, select:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(6, 182, 212, 0.15);
        background: rgba(0,0,0,0.5);
    }
    textarea { height: 120px; resize: vertical; line-height: 1.5; }

    /* Grid Layouts */
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; margin-bottom: 2rem; }
    
    .color-picker-wrap {
        display: flex; align-items: center; background: rgba(0,0,0,0.3);
        border: 1px solid var(--border); border-radius: 12px; padding: 6px;
        transition: all 0.2s;
    }
    .color-picker-wrap:focus-within { border-color: var(--accent); }
    input[type="color"] {
        -webkit-appearance: none; border: none; width: 40px; height: 40px;
        border-radius: 8px; padding: 0; cursor: pointer; background: transparent;
    }
    input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
    input[type="color"]::-webkit-color-swatch { border: none; border-radius: 8px; }
    .color-hex { margin-left: 12px; font-family: 'JetBrains Mono', monospace; font-size: 0.9rem; color: var(--text-dim); }

    /* Buttons */
    .btn-group { display: grid; grid-template-columns: 2fr 1fr; gap: 1rem; margin-top: 1rem; }
    .btn {
        padding: 16px; border-radius: 12px; font-weight: 800; border: none;
        cursor: pointer; text-transform: uppercase; letter-spacing: 1px;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        display: flex; justify-content: center; align-items: center; gap: 8px;
    }
    .btn-primary { 
        background: linear-gradient(135deg, var(--accent), #3b82f6); 
        color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,0.2);
        box-shadow: 0 10px 20px -10px rgba(6, 182, 212, 0.5);
    }
    .btn-primary:hover {
        transform: translateY(-2px);
        box-shadow: 0 15px 25px -10px rgba(6, 182, 212, 0.6);
        filter: brightness(1.1);
    }
    .btn-primary:active { transform: translateY(1px); }
    
    .btn-secondary {
        background: rgba(255,255,255,0.05); color: var(--text);
        border: 1px solid var(--border);
    }
    .btn-secondary:hover { background: rgba(255,255,255,0.1); border-color: rgba(255,255,255,0.2); }

    /* Compact Mode */
    body.compact { padding: 1rem; }
    body.compact .card { padding: 1.5rem; border-radius: 16px; border-width: 1px; }
    body.compact .title { font-size: 1.2rem; margin-bottom: 1.5rem; }
    body.compact input, body.compact textarea, body.compact select { 
        padding: 10px; font-size: 0.9rem; border-radius: 8px; 
    }
    body.compact textarea { height: 80px; }
    body.compact .btn { padding: 12px; font-size: 0.85rem; border-radius: 10px; }
  </style>
</head>
<body>

<div class="card">
    <div class="title">Live Slide Commander</div>
    
    <div class="section-title">Quick Presets</div>
    <div class="presets">
        <button class="preset-btn orange" onclick="loadTemplateLastDrinks()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
            LAST DRINKS
        </button>
        <button class="preset-btn red" onclick="loadTemplateBarClosed()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
            BAR CLOSED
        </button>
    </div>

    <div class="field-group">
        <div class="section-title">Primary Heading</div>
        <input type="text" id="live-title" placeholder="URGENT ANNOUNCEMENT...">
    </div>

    <div class="field-group">
        <div class="section-title">Detailed Subtext</div>
        <textarea id="live-detail" placeholder="Enter full details here..."></textarea>
    </div>
    
    <div class="grid-2">
        <div class="field-group">
            <div class="section-title">Countdown (Minutes)</div>
            <input type="number" id="live-countdown" placeholder="0 for no timer" min="0" max="120" value="0">
        </div>
        <div class="field-group">
            <div class="section-title">Broadcast Mode</div>
            <select id="live-mode">
                <option value="OVERRIDE">OVERRIDE (PAUSE LOOP)</option>
                <option value="INJECT">INJECT INTO LOOP</option>
            </select>
        </div>
    </div>

    <div class="field-group" style="margin-bottom: 2rem;">
        <div class="section-title">Accent Color</div>
        <div class="color-picker-wrap">
            <input type="color" id="live-accent" value="#06b6d4" oninput="document.getElementById('hex-val').innerText = this.value.toUpperCase()">
            <span class="color-hex" id="hex-val">#06B6D4</span>
        </div>
    </div>

    <div class="btn-group">
        <button class="btn btn-primary" onclick="pushLiveSlide()">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="m22 2-7 20-4-9-9-4Z"/></svg>
            Push to Billboard
        </button>
        <button class="btn btn-secondary" onclick="clearLiveSlide()">Clear</button>
    </div>
</div>

<script>
    const bc = new BroadcastChannel('ct_matrix_sync');
    if (window.location.search.includes('compact=true')) {
        document.body.classList.add('compact');
    }

    function getTabId() {
        if (window.getMatrixTabId) return window.getMatrixTabId();
        if (!window.matrixTabId) {
            window.matrixTabId = 'tab_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
        }
        return window.matrixTabId;
    }

    function pushLiveSlide() {
        const payload = {
            active: true,
            title: document.getElementById('live-title').value,
            detail: document.getElementById('live-detail').value,
            accent: document.getElementById('live-accent').value,
            mode: document.getElementById('live-mode').value
        };
        
        const countdownMins = parseInt(document.getElementById('live-countdown').value) || 0;

        // If a countdown timer is set, attach it
        if (countdownMins > 0 && document.getElementById('live-mode').value === 'OVERRIDE') {
            payload.countdownFinish = new Date(Date.now() + countdownMins * 60 * 1000).toISOString();
            // Automatically switch to bar closed if it's the last drinks template
            if (payload.title === 'LAST DRINKS') {
                payload.autoBarClosed = true;
            }
        } 
        
        // Ensure auto clear for BAR CLOSED
        if (payload.title === 'BAR IS NOW CLOSED' && document.getElementById('live-mode').value === 'OVERRIDE') {
            payload.autoClearAfter = 2 * 60 * 60 * 1000; // 2 hours
        }

        const msg = { type: 'LIVE_SLIDE', payload, senderTabId: getTabId(), commandId: 'cmd_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9), timestamp: Date.now() };
        bc.postMessage(msg);
        
        try {
            if (window.parent && window.parent.sendToFirebase) {
                window.parent.sendToFirebase(msg);
            } else if (window.sendToFirebase) {
                window.sendToFirebase(msg);
            } else {
                window.parent.postMessage({ action: 'RELAY_FIREBASE', msg }, '*');
            }
        } catch (err) {
            window.parent.postMessage({ action: 'RELAY_FIREBASE', msg }, '*');
        }
        
        // Visual feedback
        const btn = event.currentTarget;
        const originalText = btn.innerHTML;
        btn.innerHTML = '✓ PUSHED';
        btn.style.background = 'linear-gradient(135deg, #10b981, #059669)';
        setTimeout(() => {
            btn.innerHTML = originalText;
            btn.style.background = '';
        }, 2000);
    }

    function clearLiveSlide() {
        const msg = { type: 'LIVE_SLIDE', payload: { active: false }, senderTabId: getTabId(), commandId: 'cmd_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9), timestamp: Date.now() };
        bc.postMessage(msg);

        try {
            if (window.parent && window.parent.sendToFirebase) {
                window.parent.sendToFirebase(msg);
            } else if (window.sendToFirebase) {
                window.sendToFirebase(msg);
            } else {
                window.parent.postMessage({ action: 'RELAY_FIREBASE', msg }, '*');
            }
        } catch (err) {
            window.parent.postMessage({ action: 'RELAY_FIREBASE', msg }, '*');
        }

        document.getElementById('live-title').value = '';
        document.getElementById('live-detail').value = '';
        document.getElementById('live-countdown').value = 0;
        
        const btn = event.currentTarget;
        const originalText = btn.innerText;
        btn.innerText = '✓ CLEARED';
        setTimeout(() => {
            btn.innerText = originalText;
        }, 2000);
    }

    function loadTemplateLastDrinks() {
        document.getElementById('live-title').value = 'LAST DRINKS';
        document.getElementById('live-detail').value = 'The bar will be closing shortly. Please make your final purchases now.';
        document.getElementById('live-countdown').value = '10'; // Default 10 mins, customizable
        
        const accentInput = document.getElementById('live-accent');
        accentInput.value = '#f59e0b'; // Orange
        document.getElementById('hex-val').innerText = '#F59E0B';
        document.getElementById('live-mode').value = 'OVERRIDE';
    }

    function loadTemplateBarClosed() {
        document.getElementById('live-title').value = 'BAR IS NOW CLOSED';
        document.getElementById('live-detail').value = 'Last drinks has finished. Thank you for visiting, please travel home safely.';
        document.getElementById('live-countdown').value = '0'; // No timer
        
        const accentInput = document.getElementById('live-accent');
        accentInput.value = '#ef4444'; // Red
        document.getElementById('hex-val').innerText = '#EF4444';
        document.getElementById('live-mode').value = 'OVERRIDE';
    }
</script>
<script type="module">
    // Direct Firebase integration (works when loaded standalone, not in iframe)
    if (window.self === window.top) {
        import('./firebase-config.js').then(({ db, ref, set }) => {
            const COMMAND_PATH = 'matrix_command';
            function getClientIdForFirebase() {
                let id = localStorage.getItem('matrix_client_id');
                if (!id) { id = 'client_' + Math.random().toString(36).substr(2, 9); localStorage.setItem('matrix_client_id', id); }
                return id;
            }
            window.sendToFirebase = function(msg) {
                if (!db) return;
                const payload = { ...msg, source: getClientIdForFirebase(), isFirebaseBridge: true };
                set(ref(db, COMMAND_PATH), payload)
                    .then(() => console.log('[COMMANDER] ✅ Firebase write OK:', msg.type))
                    .catch((err) => console.error('[COMMANDER] ❌ Firebase write FAILED:', err));
                
                const STATE_PATH = 'matrix_state';
                const PERSISTENT_TYPES = ['MODULE_FILTER', 'SETTINGS_UPDATE', 'LIVE_SLIDE'];
                if (PERSISTENT_TYPES.includes(msg.type)) {
                    import('./firebase-config.js').then(({ update }) => {
                        update(ref(db, STATE_PATH + '/' + msg.type), payload);
                        update(ref(db, STATE_PATH), { _last_updated_by: getClientIdForFirebase() });
                    });
                }
            };
            console.log('[COMMANDER] ✅ Direct Firebase loaded.');
        });
    }
</script>
<script type="module" src="firebase-bridge.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>_ct-MATRIX | Advertising Display</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Inter:wght@400;600;700;900&family=JetBrains+Mono:wght@500;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="matrix-styles.css?v=202609101610">
  <style>
    /* Slide Controls - hover to reveal */
    .slide-controls {
      position: fixed;
      top: 1.5rem;
      left: 1.5rem;
      z-index: 5000;
      display: flex;
      align-items: center;
      gap: 0.8rem;
      padding: 0.8rem 1.2rem;
      border-radius: 2rem;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      opacity: 0;
      transform: translateY(-10px);
      transition: all 0.3s ease;
    }

    body:hover .slide-controls {
      opacity: 1;
      transform: translateY(0);
    }

    .ctrl-btn {
      background: rgba(255, 255, 255, 0.05);
      border: none;
      color: #fff;
      font-size: 1.4rem;
      cursor: pointer;
      padding: 0.6rem;
      border-radius: 0.8rem;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .ctrl-btn:hover {
      background: var(--neon-gold);
      color: #000;
      transform: scale(1.1);
    }

    .ctrl-btn:active {
      transform: scale(0.9);
    }
  </style>
</head>

<body>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <div class="matrix-bg"></div>

  <div id="app">
    <main class="slide-viewport" id="slide-viewport">
      <!-- Instant Boot Slide: Eliminates blank black screen before slides load -->
      <div class="slide active no-transition" id="slide-target" data-slide-id="boot-splash">
        <div class="slide-bg" style="display:flex; justify-content:center; align-items:center; background-color: #000;">
          <div class="logo-wrapper" style="position:relative; height: 75vh; display: flex; justify-content: center;">
            <img src="images/GOLD-FLAME-LOGO-BLACK-CLEAN.png" alt="Flame Lantern" style="height: 100%; width: auto; z-index: 2; position:relative; opacity: 1;">
          </div>
        </div>
      </div>
    </main>

    <div class="timer-bar" id="progress-bar" style="width: 0%;"></div>

    <!-- Slide Controls (hover to show) -->
    <div class="slide-controls">
      <button class="ctrl-btn" onclick="prevSlide()" title="Previous">⏮</button>
      <button class="ctrl-btn" id="play-pause-btn" onclick="togglePause()" title="Play/Pause">⏸</button>
      <button class="ctrl-btn" onclick="nextSlide()" title="Next">⏭</button>
    </div>
  </div>

  <script src="matrix-core.js?v=202609101610"></script>
  <script>
    // Confetti Trigger
    window.triggerConfetti = function () {
      const duration = 3 * 1000;
      const end = Date.now() + duration;
      (function frame() {
        confetti({ particleCount: 3, angle: 60, spread: 55, origin: { x: 0 }, colors: ['#D4AF37', '#FFD700', '#B8860B'] });
        confetti({ particleCount: 3, angle: 120, spread: 55, origin: { x: 1 }, colors: ['#D4AF37', '#FFD700', '#B8860B'] });
        if (Date.now() < end) requestAnimationFrame(frame);
      }());
    };

    // Init — the global functions nextSlide, prevSlide, togglePause
    // are already exported by matrix-core.js onto the window object
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', () => window.initMatrix());
    } else {
      window.initMatrix();
    }
  </script>
  <script type="module" src="firebase-bridge.js"></script>
</body>

</html>

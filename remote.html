<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Remote | _ct-MATRIX</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #09090b;
      --surface: #18181b;
      --surface-bright: #27272a;
      --accent: #10b981;
      --red: #ef4444;
      --purple: #8b5cf6;
      --text: #f8fafc;
      --text-dim: #94a3b8;
      --btn-bg: #18181b;
      --border: #27272a;
    }
    body { 
      background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; 
      margin: 0; padding: 12px 10px 80px 10px; display: flex; flex-direction: column; align-items: center;
      min-height: 100vh; overflow-y: auto; -webkit-overflow-scrolling: touch;
      box-sizing: border-box;
    }
    header { text-align: center; margin-bottom: 10px; }
    h1 { font-weight: 900; color: var(--accent); margin: 0; font-size: 1.2rem; }
    
    .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; width: 100%; max-width: 600px; margin-bottom: 10px; }
    .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; width: 100%; max-width: 600px; margin-bottom: 10px; }
    
    .btn {
      background: var(--btn-bg); border: 1px solid var(--border); border-radius: 12px;
      color: var(--text); padding: 10px 4px; font-size: 0.65rem; font-weight: 700;
      text-transform: uppercase; display: flex; flex-direction: column; align-items: center;
      gap: 5px; cursor: pointer; -webkit-tap-highlight-color: transparent;
    }
    .btn:active { transform: scale(0.95); background: var(--accent); color: #000; }
    .btn-icon { font-size: 1.3rem; }
    .btn-primary { border-color: var(--accent); color: var(--accent); }
    
    .section-title { width: 100%; max-width: 600px; font-size: 0.65rem; font-weight: 800; color: var(--text-dim); text-transform: uppercase; margin-bottom: 5px; }
    
    .modules { display: flex; flex-direction: column; gap: 6px; width: 100%; max-width: 600px; flex-grow: 1; }
    .mod-row { display: grid; grid-template-columns: 85px 1fr auto 50px; gap: 8px; background: var(--btn-bg); padding: 6px 10px; border-radius: 12px; align-items: center; border: 1px solid var(--border); }
    .mod-name { font-size: 0.75rem; font-weight: 900; white-space: nowrap; }
    
    .mod-toggle { display: flex; background: #000; border-radius: 6px; overflow: hidden; }
    .mod-btn { flex: 1; padding: 6px 0; text-align: center; font-size: 0.65rem; font-weight: 900; border: none; cursor: pointer; color: #666; background: transparent; transition: 0.2s; }
    .mod-btn.active-on { background: var(--accent); color: #000; }
    .mod-btn.active-off { background: #333; color: #fff; }
    
    .mod-dur-wrapper { position: relative; }
    .mod-dur { width: 100%; background: #000; color: #fff; border: 1px solid #333; padding: 6px; border-radius: 6px; text-align: center; font-size: 0.75rem; font-family: monospace; box-sizing: border-box; }
    .mod-dur-wrapper::after { content: 's'; position: absolute; right: 5px; top: 50%; transform: translateY(-50%); font-size: 0.6rem; color: #666; pointer-events: none; }
    
    .save-btn { width: 100%; max-width: 600px; background: var(--accent); color: #000; font-weight: 900; padding: 12px; border: none; border-radius: 12px; font-size: 0.8rem; cursor: pointer; margin-bottom: 10px; }
    .save-btn:active { transform: scale(0.98); }
    
    .upcoming-box { width: 100%; max-width: 600px; background: var(--btn-bg); border: 1px solid var(--border); border-radius: 12px; padding: 10px; margin-bottom: 10px; display: flex; flex-direction: column; gap: 8px; max-height: 150px; overflow-y: auto; }
    .upcoming-item { display: flex; justify-content: space-between; align-items: center; font-size: 0.7rem; padding: 5px; border-bottom: 1px solid var(--border); }
    .upcoming-item:last-child { border-bottom: none; }
    .upcoming-title { font-weight: 700; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 150px; }
    .upcoming-type { font-weight: 900; color: var(--accent); font-size: 0.6rem; }
    .upcoming-active { background: rgba(16, 185, 129, 0.1); border-radius: 4px; border: 1px solid var(--accent); }

    .status-bar { background: rgba(255,255,255,0.05); padding: 5px 15px; border-radius: 50px; font-size: 0.65rem; opacity: 0.5; margin-bottom: 20px; }
    
    /* Navigation Hub */
    .nav-hub { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(9, 9, 11, 0.95); backdrop-filter: blur(12px); border-top: 1px solid var(--border); padding: 10px 5px; display: flex; justify-content: center; gap: 12px; z-index: 1000; }
    .nav-link { color: var(--text-dim); text-decoration: none; font-size: 0.65rem; font-weight: 700; text-transform: uppercase; transition: color 0.2s; }
    .nav-link:hover { color: var(--text); }
    .nav-link.active { color: var(--accent); }
  </style>
</head>

  <script src="matrix-core.js"></script>
  <script>
    if (localStorage.getItem('matrix_migration_20260804_enable_all_modules') !== 'done') {
        try {
            const stored = localStorage.getItem('matrix_config');
            let config = stored ? JSON.parse(stored) : {};
            config.disabledModules = [];
            localStorage.setItem('matrix_config', JSON.stringify(config));
            localStorage.setItem('matrix_migration_20260804_enable_all_modules', 'done');
        } catch(e) {}
    }

    const bc = new BroadcastChannel('ct_matrix_sync');
    const bc_sub = new BroadcastChannel('mom_sync');

    // Default durations fallback
    const DEFAULT_DURS = { 'ct-matrix': 30, 'ct-mmr': 600, 'ct-wea1': 60, 'ct-ace': 180, 'ct-quiz': 60, 'ct-fir': 180, 'ct-soc': 120, 'ct-tik': 120, 'ct-loyalty': 60 };

    function getClientId() {
      let id = localStorage.getItem('matrix_client_id');
      if (!id) { id = 'client_' + Math.random().toString(36).substr(2, 9); localStorage.setItem('matrix_client_id', id); }
      return id;
    }
    function getTabId() {
      let id = sessionStorage.getItem('matrix_tab_id');
      if (!id) { id = 'tab_' + Math.random().toString(36).substr(2, 9); sessionStorage.setItem('matrix_tab_id', id); }
      return id;
    }

    function initUI() {
      let config = { disabledModules: [], moduleDurations: {} };
      try {
        const stored = localStorage.getItem('matrix_config');
        if (stored) {
            const parsed = JSON.parse(stored);
            config = { ...config, ...parsed };
            if (!parsed.hasOwnProperty('disabledModules')) {
                config.disabledModules = [];
            }
        }
      } catch(e) {}
      
      const moduleIds = ['ct-matrix', 'ct-ace', 'ct-mmr', 'ct-quiz', 'ct-wea1', 'ct-fir', 'ct-soc', 'ct-tik', 'ct-loyalty'];
      moduleIds.forEach(id => {
        const row = document.getElementById('row-' + id);
        if (!row) return;
        
        // Setup Durations
        const durInput = document.getElementById('dur-' + id);
        const allCb = document.getElementById('all-' + id);
        const durVal = config.moduleDurations && config.moduleDurations[id] !== undefined ? config.moduleDurations[id] : 'all';
        
        if (durVal === 'all') {
            if (allCb) allCb.checked = true;
            const wrap = document.getElementById('dur-wrap-' + id);
            if (wrap) wrap.style.visibility = 'hidden';
            if (durInput) durInput.value = DEFAULT_DURS[id];
        } else {
            if (allCb) allCb.checked = false;
            const wrap = document.getElementById('dur-wrap-' + id);
            if (wrap) wrap.style.visibility = 'visible';
            if (durInput) durInput.value = durVal;
        }

        // Setup Toggles
        const isOff = config.disabledModules && config.disabledModules.includes(id);
        const status = window.getModuleStatus ? window.getModuleStatus(id) : { mode: isOff ? 'OFF' : 'ON', label: isOff ? 'OFF' : 'ON', active: !isOff };
        const btnOn = row.querySelector('.btn-on');
        const btnOff = row.querySelector('.btn-off');
        if (status.mode === 'OFF') {
          btnOn.classList.remove('active-on');
          btnOn.innerText = 'ON';
          btnOff.classList.add('active-off');
          btnOff.innerText = 'OFF';
        } else if (status.mode === 'SCHEDULED') {
          btnOn.classList.add('active-on');
          btnOn.innerText = status.active ? 'SCHED' : 'OFF-HRS';
          btnOff.classList.remove('active-off');
          btnOff.innerText = 'OFF';
        } else {
          btnOn.classList.add('active-on');
          btnOn.innerText = 'ON';
          btnOff.classList.remove('active-off');
          btnOff.innerText = 'OFF';
        }
      });
      
      // Request telemetry to populate upcoming slides
      bc.postMessage({ type: 'GET_SLIDES_DUMP', senderTabId: getTabId() });
    }

    // Listen to local BroadcastChannel to stay synced if someone edits from masteradmin
    bc.onmessage = (e) => {
        if (e.data.type === 'MODULE_FILTER' || e.data.type === 'SETTINGS_UPDATE' || e.data.type === 'SCHEDULE_UPDATE') {
            // Give localStorage a tiny moment to be written by matrix-core.js before reading
            setTimeout(initUI, 100);
        }
        if (e.data.type === 'SYNC_STATE' && e.data.state && e.data.state.SETTINGS_UPDATE) {
            setTimeout(initUI, 100);
        }
        if (e.data.type === 'SLIDES_DUMP') {
            const box = document.getElementById('upcoming-slides');
            const slides = e.data.slides || [];
            if (slides.length === 0) {
                box.innerHTML = '<div style="text-align:center; opacity:0.5; font-size:0.7rem; padding:10px;">No upcoming slides.</div>';
            } else {
                box.innerHTML = slides.map((s, idx) => `
                    <div class="upcoming-item ${e.data.currentIndex === idx ? 'upcoming-active' : ''}">
                        <div class="upcoming-type">${idx + 1}. ${s.subType || 'AD'}</div>
                        <div class="upcoming-title">${s.title || (s.type === 'MODULE' ? s.id : 'Slide')}</div>
                    </div>
                `).join('');
            }
        }
    };

    function send(type) {
      const msg = { type, commandId: 'cmd_' + Date.now(), timestamp: Date.now(), source: getClientId(), senderTabId: getTabId() };
      bc.postMessage(msg);
      if (window.sendToFirebase) window.sendToFirebase(msg);
      vibrate(); showStatus('Sent: ' + type);
    }

    function jump(id) {
      const msg = { type: 'PROJECT', id, commandId: 'cmd_' + Date.now(), timestamp: Date.now(), source: getClientId(), senderTabId: getTabId() };
      bc.postMessage(msg);
      if (window.sendToFirebase) window.sendToFirebase(msg);
      vibrate(); showStatus('Jumping: ' + id);
    }

    function lastDrinks() {
      const finishTime = new Date(Date.now() + 10 * 60 * 1000).toISOString();
      const livePayload = {
        active: true,
        title: "LAST DRINKS",
        detail: "The bar will be closing in 10 minutes. Please make your final purchases now.",
        accent: "#f59e0b",
        mode: "OVERRIDE",
        countdownFinish: finishTime,
        autoBarClosed: true
      };
      const msg = { type: 'LIVE_SLIDE', payload: livePayload, commandId: 'cmd_' + Date.now(), timestamp: Date.now(), source: getClientId(), senderTabId: getTabId() };
      bc.postMessage(msg);
      if (window.sendToFirebase) window.sendToFirebase(msg);
      vibrate([100, 50, 100]); showStatus('LIVE: LAST DRINKS');
    }

    function barClosed() {
      const livePayload = {
        active: true,
        title: "BAR IS NOW CLOSED",
        detail: "Last drinks has finished. Thank you for visiting, please travel home safely.",
        accent: "#ef4444",
        mode: "OVERRIDE",
        autoClearAfter: 2 * 60 * 60 * 1000
      };
      const msg = { type: 'LIVE_SLIDE', payload: livePayload, commandId: 'cmd_' + Date.now(), timestamp: Date.now(), source: getClientId(), senderTabId: getTabId() };
      bc.postMessage(msg);
      if (window.sendToFirebase) window.sendToFirebase(msg);
      vibrate([100, 50, 100]); showStatus('LIVE: BAR CLOSED');
    }

    function clearLive() {
      const msg = { type: 'LIVE_SLIDE', payload: { active: false }, commandId: 'cmd_' + Date.now(), timestamp: Date.now(), source: getClientId(), senderTabId: getTabId() };
      bc.postMessage(msg);
      if (window.sendToFirebase) window.sendToFirebase(msg);
      vibrate(); showStatus('LIVE CLEARED');
    }

    function celebrate() {
      const msg = { type: 'CONFETTI', commandId: 'cmd_' + Date.now(), timestamp: Date.now(), source: getClientId(), senderTabId: getTabId() };
      bc.postMessage(msg);
      if (window.sendToFirebase) window.sendToFirebase(msg);
      bc_sub.postMessage({ type: 'CONFETTI', commandId: msg.commandId, timestamp: msg.timestamp });
      vibrate([100, 50, 100]); showStatus('CONFETTI TRIGGERED');
    }

    function toggleModule(rawId, state) {
      const msg = { type: 'MODULE_FILTER', id: rawId, active: state, commandId: 'cmd_' + Date.now(), timestamp: Date.now(), source: getClientId(), senderTabId: getTabId() };
      bc.postMessage(msg);
      if (window.sendToFirebase) window.sendToFirebase(msg);
      vibrate(); showStatus(`${rawId} ${state ? 'ON' : 'OFF'}`);
      
      // Optimistically update local config and UI so it feels instant
      let config = { disabledModules: [] };
      try {
        const stored = localStorage.getItem('matrix_config');
        if (stored) config = { ...config, ...JSON.parse(stored) };
      } catch(e) {}
      const fullId = rawId.toLowerCase().startsWith('ct-') ? rawId.toLowerCase() : 'ct-' + rawId.toLowerCase();
      if (state) {
          config.disabledModules = config.disabledModules.filter(m => m !== fullId);
      } else {
          if (!config.disabledModules.includes(fullId)) config.disabledModules.push(fullId);
      }
      localStorage.setItem('matrix_config', JSON.stringify(config));
      initUI();
    }

    function saveModuleDurations() {
        const moduleIds = ['ct-matrix', 'ct-ace', 'ct-mmr', 'ct-quiz', 'ct-wea1', 'ct-fir', 'ct-soc', 'ct-tik', 'ct-loyalty'];
        const durations = {};
        let hasErrors = false;
        moduleIds.forEach(id => {
            const allCb = document.getElementById('all-' + id);
            const el = document.getElementById('dur-' + id);
            if (el) el.style.borderColor = '';
            
            if (allCb && allCb.checked) {
                durations[id] = 'all';
            } else {
                if (el) {
                    const val = parseInt(el.value);
                    if (val && val >= 10) {
                        durations[id] = val;
                    } else {
                        el.style.borderColor = '#ef4444';
                        hasErrors = true;
                    }
                }
            }
        });

        if (hasErrors) {
            vibrate([100, 50, 100]);
            showStatus('ERROR: Min duration is 10s');
            return;
        }

        let config = {};
        try {
            const stored = localStorage.getItem('matrix_config');
            if (stored) config = JSON.parse(stored);
        } catch(e) {}
        config.moduleDurations = durations;
        localStorage.setItem('matrix_config', JSON.stringify(config));

        const msg = {
            type: 'SETTINGS_UPDATE',
            payload: { moduleDurations: durations },
            commandId: 'cmd_' + Date.now(),
            timestamp: Date.now(),
            senderTabId: getTabId(),
            source: getClientId()
        };
        bc.postMessage(msg);
        if (window.sendToFirebase) window.sendToFirebase(msg);

        vibrate();
        showStatus('DURATIONS SAVED');
    }

    window.toggleRemotePlayAll = function(id, isChecked) {
        const wrap = document.getElementById('dur-wrap-' + id);
        if (wrap) {
            wrap.style.visibility = isChecked ? 'hidden' : 'visible';
        }
    };

    function vibrate(pattern = 50) {
      if (window.navigator && window.navigator.vibrate) window.navigator.vibrate(pattern);
    }
    function showStatus(msg) {
      const el = document.getElementById('status');
      el.innerText = msg; el.style.opacity = '1';
      setTimeout(() => el.style.opacity = '0.5', 2000);
    }

    // Run immediately
    initUI();
  </script>
  <script type="module">
    import { db, ref, set, update } from './firebase-config.js';
    const COMMAND_PATH = 'matrix_command';
    const STATE_PATH = 'matrix_state';
    
    function getClientIdForFirebase() {
        let id = localStorage.getItem('matrix_client_id');
        if (!id) { id = 'client_' + Math.random().toString(36).substr(2, 9); localStorage.setItem('matrix_client_id', id); }
        return id;
    }
    
    window.sendToFirebase = function(msg) {
        if (!db) return;
        const payload = JSON.parse(JSON.stringify({ ...msg, source: getClientIdForFirebase(), isFirebaseBridge: true }));
        set(ref(db, COMMAND_PATH), payload);
        
        // If it's a persistent state change, also update state node (mirrors masteradmin)
        const PERSISTENT_TYPES = ['MODULE_FILTER', 'SETTINGS_UPDATE', 'LIVE_SLIDE'];
        if (PERSISTENT_TYPES.includes(msg.type)) {
            update(ref(db, STATE_PATH + '/' + msg.type), payload);
            update(ref(db, STATE_PATH), { _last_updated_by: getClientIdForFirebase() });
        }
    };
  </script>
  <script type="module" src="firebase-bridge.js"></script>
</body>
</html>
